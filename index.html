<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>LC Fantasy Cricket App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
/* Layout: single phone-width app column on a sand backdrop. Green curved hero per screen with a gold score tile, white rounded cards, bottom tab bar, floating green action button. */
:root{
  --sand:#F1E9DC; --surface:#FFFFFF; --soft:#FAF7F1; --ink:#1B1C1A; --muted:#8C8F8A; --line:#ECE6DB;
  --green:#34906A; --green-deep:#2A7B59; --green-light:#46A07A; --on-green:#FFFFFF;
  --gold:#E2C88F; --gold-soft:#FBF5E8; --gold-line:#E8D9B5; --gold-ink:#A9873F;
  --red:#C8102E; --red-deep:#8E0B20; --seam:#F7F1E6; --bad:#B8402F; --bad-soft:#FBEAE6;
  --font:"Jost","Futura","Century Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sand:#0F1210; --surface:#171C19; --soft:#1D2420; --ink:#ECEDE8; --muted:#94998F; --line:#29312C;
  --green:#2F8462; --green-deep:#24694D; --green-light:#3A9370; --on-green:#FFFFFF;
  --gold:#D7BC81; --gold-soft:#2A2519; --gold-line:#4A3F26; --gold-ink:#E2C88F;
  --red:#D3203C; --red-deep:#8E0B20; --seam:#F7F1E6; --bad:#F08A78; --bad-soft:#3A1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --sand:#0F1210; --surface:#171C19; --soft:#1D2420; --ink:#ECEDE8; --muted:#94998F; --line:#29312C;
  --green:#2F8462; --green-deep:#24694D; --green-light:#3A9370; --on-green:#FFFFFF;
  --gold:#D7BC81; --gold-soft:#2A2519; --gold-line:#4A3F26; --gold-ink:#E2C88F;
  --red:#D3203C; --red-deep:#8E0B20; --seam:#F7F1E6; --bad:#F08A78; --bad-soft:#3A1F1A; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--green)}
.shell{max-width:460px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;box-shadow:0 0 60px rgba(60,50,30,.08)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font-family:var(--font)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* ---- Splash ---- */
#splash{position:fixed;inset:0;z-index:100;background:var(--green);display:grid;place-items:center;color:var(--on-green);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:min(78vw,340px);height:auto;overflow:visible}
.sp-title{font-size:26px;font-weight:600;text-align:center;margin-top:8px;opacity:0;animation:fadeUp .5s ease 1.05s forwards;letter-spacing:.01em}
.sp-title small{display:block;font-size:14px;font-weight:400;opacity:.8}
.bat{transform-box:view-box;transform-origin:236px 64px;animation:swing 1.6s cubic-bezier(.5,0,.3,1) forwards}
.ballfly{animation:fly 1.6s linear forwards}
.ballspin{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
.burst{opacity:0;transform-box:view-box;transform-origin:196px 214px;animation:burst .45s ease-out .72s forwards}
@keyframes swing{0%{transform:rotate(-80deg)}38%{transform:rotate(-30deg)}46%{transform:rotate(14deg)}72%{transform:rotate(72deg)}100%{transform:rotate(78deg)}}
@keyframes fly{0%{transform:translate(-60px,262px)}46%{transform:translate(184px,214px)}100%{transform:translate(430px,-90px) scale(.45)}}
@keyframes burst{0%{opacity:0;transform:scale(.4)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Loader ---- */
#loader{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--surface) 86%,transparent);display:grid;place-items:center;backdrop-filter:blur(2px)}
.ldr{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:500;color:var(--muted)}
.ldr svg{width:64px;height:64px;animation:spin .9s linear infinite}

/* ---- Hero ---- */
.hero{background:var(--green);color:var(--on-green);position:relative;overflow:hidden;padding-block:calc(16px + env(safe-area-inset-top,0px)) 26px;border-radius:0 0 28px 28px}
.hero::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:var(--green-light);opacity:.35;right:-300px;top:-330px}
.hero::after{content:"";position:absolute;width:600px;height:400px;border-radius:50%;background:var(--green-deep);opacity:.45;left:-260px;bottom:-300px}
.hero>*{position:relative;z-index:1}
.topbar{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;min-height:36px}
.topbar .t{text-align:center;font-weight:600;font-size:18px}
.topbar .l{font-size:13px;font-weight:600;opacity:.85;letter-spacing:.04em}
.topbar .r{justify-self:end;background:none;border:0;color:var(--gold);font-weight:500;font-size:15px;cursor:pointer;padding:6px 0}
.badge{width:88px;height:88px;border-radius:22px;background:var(--gold);color:var(--on-green);display:grid;place-items:center;font-size:32px;font-weight:500;margin:22px auto 0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hname{text-align:center;font-size:36px;font-weight:500;margin:18px 0 0;line-height:1.1;text-wrap:balance}
.hsub{display:flex;justify-content:space-between;gap:12px;margin-top:22px;font-size:15px;opacity:.95}
.hsub span{opacity:.7}

/* ---- Content ---- */
main{padding-block:22px calc(170px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:26px}
.lbl{font-size:16px;font-weight:500;margin:0 0 12px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lbl-row a,.link{color:var(--green);font-weight:500;font-size:15px;background:none;border:0;cursor:pointer;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle button{height:62px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;font-weight:600;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--on-green)}
.seg{display:grid;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.seg button{height:48px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;font-weight:600;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold-line);color:var(--ink)}
.quota{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.quota div{padding:10px 4px;text-align:center;border-left:1px solid var(--line)}
.quota div:first-child{border-left:0}
.quota b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.quota small{font-size:12px;color:var(--muted);letter-spacing:.06em}
.quota .full{background:var(--gold-soft)}
.meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--green)}
.meter.over i{background:var(--bad)}
.note{font-size:14px;color:var(--muted)}
.banner{border-radius:14px;padding:12px 14px;font-size:14.5px;background:var(--gold-soft);border:1px solid var(--gold-line)}
.banner.err{background:var(--bad-soft);border-color:transparent}
.banner.ok{background:color-mix(in srgb,var(--green) 12%,var(--surface));border-color:transparent}
.search{display:flex;gap:10px;flex-wrap:wrap}
input,select{font:500 15px var(--font);padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.search input{flex:1 1 150px}
.p{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.p:first-child{border-top:0}
.nm{font-weight:500;font-size:16px}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.role{font-size:11px;font-weight:600;letter-spacing:.06em;padding:1px 7px;border-radius:6px;background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-line)}
.price{font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;text-align:right;min-width:40px}
.acts{display:flex;gap:6px}
.ic{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;display:grid;place-items:center}
.ic.add{background:var(--green);border-color:var(--green);color:var(--on-green);font-size:22px;font-weight:400}
.ic.rm{color:var(--bad);font-size:22px;font-weight:400}
.ic.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.ic.cap{background:var(--gold);border-color:var(--gold);color:var(--on-green)}
.ic:disabled{opacity:.3;cursor:not-allowed}
.ic.wide{width:auto;padding:0 10px}
.why{font-size:12px;color:var(--muted);text-align:right;max-width:96px}
.tag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--gold);color:var(--on-green)}
.tag.g{background:var(--green)}
.tag.m{background:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.statrow div{padding:14px 8px;text-align:center;border-left:1px solid var(--line)}
.statrow div:first-child{border-left:0}
.statrow b{display:block;font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.statrow small{font-size:12px;color:var(--muted)}
.fix{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fx{border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:600;font-size:16px}
.fx small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-weight:500;font-size:12px;color:var(--muted);text-align:left;padding:10px 6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums}
td.big{font-size:19px;font-weight:500}
tr.me td{background:var(--gold-soft)}
.line{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:26px}
.spark i{width:7px;background:var(--green);border-radius:2px 2px 0 0}
.rules td:first-child{width:62%}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{height:48px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.block{width:100%;height:56px;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- FAB + nav ---- */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:72px;height:72px;border-radius:24px;background:var(--green);border:0;display:grid;place-items:center;cursor:pointer;z-index:40;box-shadow:0 10px 24px color-mix(in srgb,var(--green) 40%,transparent)}
.fab svg{width:28px;height:28px}
.fab:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.fab-l{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:40;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:3px 10px;border-radius:999px;white-space:nowrap}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--green)}

/* ---- Home dashboard ---- */
.dash{background:var(--surface);padding-block:calc(16px + env(safe-area-inset-top,0px)) 4px}
.dash .topbar .t{color:var(--ink)}
.dash .topbar .l{color:var(--green)}
.hello{font-size:17px;font-weight:500;margin:18px 0 14px;line-height:1.2}
.hello b{font-size:30px;font-weight:600;color:var(--green)}
.gwstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gwd{border:0;background:none;border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;color:var(--ink);cursor:pointer}
.gwd small{font-size:11px;color:var(--muted);letter-spacing:.06em}
.gwd b{font-size:22px;font-weight:600;line-height:1.1}
.gwd em{font-style:normal;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gwd.done em{color:var(--green);font-weight:600}
.gwd.cur{background:var(--green);color:var(--on-green)}
.gwd.cur small,.gwd.cur em{color:var(--gold)}
.livecard{background:linear-gradient(135deg,var(--green-light),var(--green-deep));color:var(--on-green);border-radius:22px;padding:18px;display:grid;grid-template-columns:1.25fr 1fr;gap:12px;position:relative;overflow:hidden}
.livecard::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:2px solid color-mix(in srgb,var(--gold) 60%,transparent)}
.lc-stats{display:flex;flex-direction:column;gap:6px}
.lc-stats div{display:flex;flex-direction:column;border-bottom:1px solid color-mix(in srgb,var(--on-green) 18%,transparent);padding-bottom:6px}
.lc-stats div:last-child{border-bottom:0}
.livecard b{font-size:28px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.livecard small{font-size:12px;opacity:.8}
.lc-side{display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.lc-k{align-self:flex-start;background:var(--gold);color:var(--on-green);font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.lc-side div{display:flex;flex-direction:column}
.lc-side b{font-size:22px}
.ground{position:relative;border-radius:50% / 30%;padding:34px 10px 40px;display:flex;flex-direction:column;justify-content:space-around;gap:22px;min-height:600px;overflow:hidden;
  background:repeating-linear-gradient(0deg,transparent 0 34px,rgba(255,255,255,.05) 34px 68px),radial-gradient(ellipse at 50% 50%,#3FA374 0%,#2F8A63 55%,#257553 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),inset 0 0 0 7px #2B7D5A}
.ground::before{content:"";position:absolute;left:12%;right:12%;top:16%;bottom:16%;border:2px dashed rgba(255,255,255,.45);border-radius:50%;pointer-events:none}
.pitch{position:absolute;left:50%;top:50%;width:46px;height:56%;transform:translate(-50%,-50%);background:linear-gradient(#D9C08A,#CDB27A);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.pitch::before,.pitch::after{content:"";position:absolute;left:-8px;right:-8px;height:2px;background:#fff;opacity:.9}
.pitch::before{top:10%}.pitch::after{bottom:10%}
.frow{display:flex;justify-content:center;gap:6px;position:relative;z-index:1;flex-wrap:wrap}
.tok{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:78px;cursor:pointer;color:#fff;padding:0}
.shirt{width:46px;height:46px;border-radius:15px;background:var(--surface);color:var(--green);display:grid;place-items:center;font-weight:700;font-size:15px;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.22)}
.tok.empty .shirt{background:rgba(255,255,255,.18);color:#fff;border:1.5px dashed rgba(255,255,255,.8);font-size:22px;font-weight:400;box-shadow:none}
.cv{position:absolute;top:-6px;right:-8px;font-style:normal;font-size:10px;font-weight:700;background:var(--gold);color:#fff;border-radius:7px;padding:1px 5px;border:2px solid var(--surface)}
.cv.vc{background:#7E837D}
.tn{font-size:12.5px;font-weight:600;background:rgba(10,40,28,.55);padding:1px 7px;border-radius:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{font-size:10px;opacity:.85;white-space:nowrap}
.benchrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bch{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:14px;padding:10px 4px}
.bch small{display:block;font-size:11px;color:var(--muted)}
.shirt.sm{width:36px;height:36px;border-radius:12px;font-size:12px;background:var(--gold-soft);color:var(--gold-ink);box-shadow:none;border:1px solid var(--gold-line)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qk{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink);font-size:13px}
.qk b{font-weight:600}
.qk small{font-size:11px;color:var(--muted);text-align:center}
.qi{width:42px;height:42px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center}
.qi svg{width:22px;height:22px}
@media (max-width:380px){.tok{width:68px}.livecard b{font-size:24px}.quick{grid-template-columns:repeat(2,1fr)}}

/* ---- ESPN-style additions ---- */
.gwstrip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.gwd{flex:0 0 54px}
.gwd em.win{color:var(--green);font-weight:700}.gwd em.loss{color:var(--bad);font-weight:700}
.gwd.cur em{color:var(--gold)}
.draftcard{grid-template-columns:1fr auto;align-items:center}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--on-green);position:relative;z-index:1}
.price small{display:block;font-size:10.5px;color:var(--muted);font-weight:500;letter-spacing:.04em}
.st{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px}
.st.on{background:color-mix(in srgb,var(--green) 14%,var(--surface));color:var(--green)}
.st.off{background:var(--bad-soft);color:var(--bad)}
.sd{position:absolute;top:-3px;left:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.sd.on{background:#3FCB8A}.sd.off{background:#E0533F}
.sd.inl{position:static;display:inline-block;vertical-align:-1px;border-color:transparent}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow select{width:100%;padding:10px 12px}
.slot{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surface));border-radius:8px;text-align:center;padding:6px 0}
.mt th{white-space:normal}
.mt td{padding:9px 4px}
.mt .sl{text-align:center;font-size:11px;font-weight:700;color:var(--green);width:44px}
.mc{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc span{font-size:14px;font-weight:500;min-width:0}
.mc small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.mc b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.rt .mc{flex-direction:row-reverse;text-align:right}
.br{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.br b{font-weight:600;font-variant-numeric:tabular-nums}
.br b.win{color:var(--green)}.br b.loss{color:var(--bad)}
.sch{padding:10px 0;border-top:1px solid var(--line)}.sch:first-child{border-top:0}
tr.cut td{border-bottom:2px dashed var(--gold)}
hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.ic.rmw{color:var(--bad)}
.ground .frow{gap:10px}

/* ---- Auth ---- */
.auth main{padding-block:24px 40px}

<script>
/* ---------- Data ---------- */
const TEAMS={DSG:"Durban's Super Giants",JSK:"Joburg Super Kings",MICT:"MI Cape Town",PR:"Paarl Royals",PC:"Pretoria Capitals",SEC:"Sunrisers Eastern Cape"};
const TEAM_KEYS=Object.keys(TEAMS);
const RAW=`DSG|Jos Buttler|WK|3|1

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const PLAYERS=RAW.trim().split("\n").map((l,i)=>{const[t,n,r,tier,os]=l.split("|");const base={3:9.5,2:7.5,1:5.5}[tier];const adj=(r==="AR"?0.5:0)+((hash(n)%3)-1)*0.5;return{id:i,team:t,name:n,role:r,tier:+tier,os:os==="1",price:Math.max(4.5,base+adj)}});
const BY_ID=Object.fromEntries(PLAYERS.map(p=>[p.id,p]));

/* ---------- League rules (ESPN-style, adapted for cricket) ---------- */
const NT=8, ROUNDS=12, WEEKS=10, REG_WEEKS=7, USER=0;
const SLOTS=["WK","BAT","BAT","AR","AR","BWL","BWL","BWL","FLEX"];
const ROLE_MIN={WK:1,BAT:2,AR:2,BWL:3};
const ROLE_MAX={WK:2,BAT:4,AR:4,BWL:5};
const ROLES=["WK","BAT","AR","BWL"];
const ROLE_NAME={WK:"Wicketkeepers",BAT:"Batters",AR:"All-rounders",BWL:"Bowlers"};

/* SA20 rounds: double round robin of 6 franchises, each franchise plays once per round = one fantasy week */
function buildFixtures(){const t=[...TEAM_KEYS];const rounds=[];for(let r=0;r<5;r++){rounds.push([[t[0],t[5]],[t[1],t[4]],[t[2],t[3]]]);t.splice(1,0,t.pop())}
  return[...rounds,...rounds.map(rd=>rd.map(([a,b])=>[b,a]))]}
const FIXTURES=buildFixtures();
/* Fantasy schedule: 8 teams, 7-week round robin */
function buildSchedule(){const a=[...Array(NT).keys()];const out=[];for(let r=0;r<REG_WEEKS;r++){const wk=[];for(let i=0;i<NT/2;i++)wk.push([a[i],a[NT-1-i]]);out.push(wk);a.splice(1,0,a.pop())}return out}
const SCHEDULE=buildSchedule();

/* ---------- Simulation ---------- */
function matchXI(team,key){const r=rng(hash(key+"xi"+team));const pool=PLAYERS.filter(p=>p.team===team).map(p=>({p,s:p.tier+r()*1.7}));pool.sort((a,b)=>b.s-a.s);let xi=pool.slice(0,11).map(x=>x.p);
  if(!xi.some(p=>p.role==="WK")){const wk=pool.find(x=>x.p.role==="WK");xi[10]=wk.p}
  let os=xi.filter(p=>p.os);while(os.length>4){const drop=os.pop();const rep=pool.find(x=>!x.p.os&&!xi.includes(x.p));xi[xi.indexOf(drop)]=rep.p}
  return xi}
function pois(r,l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}
function statLine(p,key){const r=rng(hash(key+"|"+p.id));const t=p.tier;const L={played:true};
  const batP={WK:.95,BAT:.95,AR:.8,BWL:.3}[p.role];
  if(r()<batP){const mean={WK:[0,15,22,30],BAT:[0,15,22,30],AR:[0,11,16,23],BWL:[0,5,6,8]}[p.role][t];
    let runs=Math.min(125,Math.floor(-mean*Math.log(1-r()*0.995)));const sr=95+r()*70+t*10-(p.role==="BWL"?25:0);
    const balls=Math.max(1,Math.round(runs*100/sr)+(runs===0?1+Math.floor(r()*3):0));const sixes=Math.round(runs*.055*r()*1.4);const fours=Math.max(0,Math.round((runs-6*sixes)*.18*r()*1.3));
    L.bat={runs,balls,fours,sixes,out:r()>0.22}}
  const bowlP={WK:0,BAT:.06,AR:.7,BWL:.97}[p.role];
  if(r()<bowlP){const overs=p.role==="BWL"?4:(p.role==="AR"?2+Math.floor(r()*3):1);let wk=0,md=0;const pw=.2+t*.045;
    for(let o=0;o<overs;o++){if(r()<pw)wk++;if(r()<pw*.25)wk++;if(r()<.03)md++}
    wk=Math.min(wk,5);const econ=Math.max(4,6.4+r()*4.6-t*.45);const lbwb=Array.from({length:wk}).filter(()=>r()<.3).length;
    L.bowl={overs,maidens:md,runs:Math.round(econ*overs),wkts:wk,lbwb}}
  L.field={ct:pois(r,p.role==="WK"?.9:.35),st:p.role==="WK"?pois(r,.12):0,rod:pois(r,.04),roi:pois(r,.06)};
  return L}
function score(L,role){const parts=[];let s=0;const add=(n,l)=>{if(n){s+=n;parts.push([l,n])}};
  add(4,"Starting XI");
  if(L.bat){const b=L.bat;add(b.runs,`${b.runs} runs`);add(b.fours,`${b.fours}×4 bonus`);add(b.sixes*2,`${b.sixes}×6 bonus`);
    if(b.runs>=100)add(16,"Century");else if(b.runs>=50)add(8,"Half-century");else if(b.runs>=30)add(4,"30-run bonus");
    if(b.runs===0&&b.out&&role!=="BWL")add(-2,"Duck");
    if(role!=="BWL"&&b.balls>=10){const sr=b.runs*100/b.balls;add(sr>170?6:sr>150?4:sr>=130?2:sr<50?-6:sr<60?-4:sr<=70?-2:0,`SR ${sr.toFixed(0)}`)}}
  if(L.bowl){const w=L.bowl;add(w.wkts*25,`${w.wkts} wkt`);add(w.lbwb*8,"LBW/bowled bonus");add(w.wkts>=5?16:w.wkts===4?8:w.wkts===3?4:0,`${w.wkts}-wicket haul`);add(w.maidens*12,"Maiden");
    if(w.overs>=2){const e=w.runs/w.overs;add(e<5?6:e<6?4:e<=7?2:e>12?-6:e>11?-4:e>=10?-2:0,`Econ ${e.toFixed(1)}`)}}
  const f=L.field;add(f.ct*8,`${f.ct} ct`);add(f.ct>=3?4:0,"3-catch bonus");add(f.st*12,"Stumping");add(f.rod*12,"Run out (direct)");add(f.roi*6,"Run out (assist)");
  return{s,parts}}
function fmtLine(L){const a=[];if(L.bat)a.push(`${L.bat.runs}${L.bat.out?"":"*"}(${L.bat.balls})`);else a.push("dnb");if(L.bowl)a.push(`${L.bowl.overs}-${L.bowl.maidens}-${L.bowl.runs}-${L.bowl.wkts}`);
  const f=L.field;const fl=[f.ct&&`${f.ct}ct`,f.st&&`${f.st}st`,(f.rod+f.roi)&&`${f.rod+f.roi}ro`].filter(Boolean).join(" ");if(fl)a.push(fl);return a.join(" · ")}
const gwCache={};
function simGW(g){const k=S.seed+"w"+g;if(gwCache[k])return gwCache[k];const res={};PLAYERS.forEach(p=>res[p.id]={pts:0,lines:[],played:false});
  FIXTURES[g].forEach(([a,b],m)=>{const mk=k+"m"+m;[a,b].forEach(team=>{const opp=team===a?b:a;matchXI(team,mk).forEach(p=>{const L=statLine(p,mk);const sc=score(L,p.role);const r=res[p.id];r.played=true;r.pts+=sc.s;r.lines.push({opp,L,sc})})})});
  return gwCache[k]=res}

/* ---------- Projections (expected points per match, used for draft rankings) ---------- */
const PROJ={},PPLAY={};
(function(){const N=40,play={},pts={};PLAYERS.forEach(p=>{play[p.id]=0;pts[p.id]=0});
  for(let i=0;i<N;i++){const k="proj"+i;TEAM_KEYS.forEach(t=>matchXI(t,k).forEach(p=>{play[p.id]++;pts[p.id]+=score(statLine(p,k),p.role).s}))}
  PLAYERS.forEach(p=>{PPLAY[p.id]=play[p.id]/N;PROJ[p.id]=Math.round(play[p.id]?pts[p.id]/play[p.id]*PPLAY[p.id]:0)})})();
const RANK={};[...PLAYERS].sort((a,b)=>PROJ[b.id]-PROJ[a.id]).forEach((p,i)=>RANK[p.id]=i+1);

/* ---------- State ---------- */
const KEY="lc-fantasy-espn-v1",ACC="lc-fantasy-accounts";
const DEMO={email:"lee.test",display:"Lee.test",password:"123",name:"Lee"};
const RIVALS=[["Thandi M.","Newlands Nightwatch"],["Pieter V.","Boland Bouncers"],["Aisha K.","Kingsmead Swingers"],["Sipho N.","Wanderers Wagon Wheel"],["Megan R.","Centurion Cover Drives"],["Rohan P.","St George's Slips"],["Lerato D.","Paarl Pinch Hitters"]];
let S;
function fresh(){const seed=Math.floor(Math.random()*1e9);const r=rng(seed);const order=[...Array(NT).keys()].sort(()=>r()-.5);
  return{seed,phase:"predraft",order,picks:[],rosters:Array.from({length:NT},()=>[]),lineups:Array.from({length:NT},()=>Array(SLOTS.length).fill(null)),
    week:0,played:[],seeds:null,tab:"home",teamName:"LC Strikers",rivals:RIVALS.map(([m,t])=>({manager:m,name:t}))}}
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.rosters&&j.order)return j}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function accounts(){try{return JSON.parse(localStorage.getItem(ACC))||[]}catch(e){return[]}}
S=load();

/* ---------- League helpers ---------- */
function teamName(t){return t===USER?S.teamName:S.rivals[t-1].name}
function managerName(t){return t===USER?(ui.user?.name||"You"):S.rivals[t-1].manager}
function ownerOf(id){for(let t=0;t<NT;t++)if(S.rosters[t].includes(id))return t;return null}
function freeAgents(){const own=new Set(S.rosters.flat());return PLAYERS.filter(p=>!own.has(p.id))}
function roleCount(ros,r){return ros.filter(id=>BY_ID[id].role===r).length}
function draftBlock(ros,p){if(roleCount(ros,p.role)>=ROLE_MAX[p.role])return`${p.role} limit`;const left=ROUNDS-ros.length-1;
  const need=ROLES.reduce((a,r)=>a+Math.max(0,ROLE_MIN[r]-roleCount(ros,r)-(r===p.role?1:0)),0);return need>left?"Need other roles":null}
function swapBlock(ros,addId,dropId){const n=ros.filter(i=>i!==dropId).concat(addId);for(const r of ROLES){const c=roleCount(n,r);if(c>ROLE_MAX[r])return`Too many ${r}`;if(c<ROLE_MIN[r])return`Need ${ROLE_MIN[r]} ${r}`}return null}
function eligible(slot,id){return id!=null&&(slot==="FLEX"||BY_ID[id].role===slot)}
function weekRes(g){return g<WEEKS?simGW(g):null}
function inXI(id,g=S.week){const r=weekRes(g);return r?r[id].played:false}
function bestLineup(ros,g){const res=weekRes(g);const val=id=>(res&&!res[id].played?-1000:0)+PROJ[id];const used=new Set();const out=Array(SLOTS.length).fill(null);
  ["WK","BWL","AR","BAT","FLEX"].forEach(s=>SLOTS.forEach((sl,i)=>{if(sl!==s)return;const c=ros.filter(id=>!used.has(id)&&eligible(sl,id)).sort((a,b)=>val(b)-val(a))[0];if(c!=null){out[i]=c;used.add(c)}}));return out}
function lineupProj(lu,g){return lu.reduce((a,id)=>a+(id!=null&&inXI(id,g)?PROJ[id]:0),0)}

/* matchups for a week: [a,b] pairs; playoff weeks use seeds */
function matchups(g){if(g<REG_WEEKS)return SCHEDULE[g];if(!S.seeds)return[];const s=S.seeds;
  if(g<9)return[[s[0],s[3]],[s[1],s[2]]];if(!S.final)return[];return[S.final,S.third]}
function weekScore(g,t){return S.played[g]?S.played[g].scores[t]:null}
function semiTotal(t){return(weekScore(7,t)||0)+(weekScore(8,t)||0)}
function record(t){let w=0,l=0,ti=0,pf=0,pa=0;for(let g=0;g<Math.min(S.week,REG_WEEKS);g++){const m=SCHEDULE[g].find(p=>p.includes(t));const o=m[0]===t?m[1]:m[0];const a=weekScore(g,t),b=weekScore(g,o);pf+=a;pa+=b;if(a>b)w++;else if(a<b)l++;else ti++}return{w,l,ti,pf,pa}}
function standings(){return[...Array(NT).keys()].map(t=>({t,...record(t)})).sort((a,b)=>(b.w+b.ti/2)-(a.w+a.ti/2)||b.pf-a.pf)}
function recStr(r){return`${r.w}-${r.l}${r.ti?"-"+r.ti:""}`}
function userMatch(g){return matchups(g).find(p=>p.includes(USER))||null}
function weekLabel(g){return g<REG_WEEKS?`Week ${g+1}`:g<9?`Semi-final · week ${g+1}`:`Final · week ${g+1}`}

/* ---------- Draft ---------- */
function pickTeam(n){const r=Math.floor(n/NT),i=n%NT;return S.order[r%2===0?i:NT-1-i]}
function availableForDraft(){const own=new Set(S.picks.map(p=>p.id));return PLAYERS.filter(p=>!own.has(p.id))}
function chooseFor(t,noise){const r=rng(hash(S.seed+"dp"+S.picks.length));const ros=S.rosters[t];
  return availableForDraft().filter(p=>!draftBlock(ros,p)).map(p=>({p,v:PROJ[p.id]*(noise?0.82+r()*0.36:1)})).sort((a,b)=>b.v-a.v)[0].p}
function makePick(t,id){S.picks.push({t,id,n:S.picks.length});S.rosters[t].push(id)}
function runDraft(stopAtUser=true){while(S.picks.length<NT*ROUNDS){const t=pickTeam(S.picks.length);if(t===USER&&stopAtUser)break;makePick(t,chooseFor(t,t!==USER).id)}
  if(S.picks.length>=NT*ROUNDS)finishDraft()}
function finishDraft(){S.phase="season";for(let t=0;t<NT;t++)S.lineups[t]=bestLineup(S.rosters[t],0)}

/* ---------- Play a week ---------- */
function playWeek(){const g=S.week;const res=simGW(g);for(let t=1;t<NT;t++)S.lineups[t]=bestLineup(S.rosters[t],g);
  const scores=[],lus=[];for(let t=0;t<NT;t++){const lu=[...S.lineups[t]];lus.push(lu);scores.push(lu.reduce((a,id)=>a+(id!=null?res[id].pts:0),0))}
  S.played[g]={scores,lineups:lus};S.week++;
  if(S.week===REG_WEEKS)S.seeds=standings().slice(0,4).map(x=>x.t);
  if(S.week===9){const s=S.seeds;const w1=semiTotal(s[0])>=semiTotal(s[3])?s[0]:s[3],l1=w1===s[0]?s[3]:s[0];const w2=semiTotal(s[1])>=semiTotal(s[2])?s[1]:s[2],l2=w2===s[1]?s[2]:s[1];S.final=[w1,w2];S.third=[l1,l2]}
  if(S.week===WEEKS){const[a,b]=S.final;S.champion=weekScore(9,a)>=weekScore(9,b)?a:b;S.phase="done"}
  if(S.week<WEEKS)S.lineups[USER]=S.lineups[USER].map((id,i)=>id);}

  const cell=id=>{if(id==null)return'<span class="note">Empty</span>';const p=BY_ID[id];const v=showPts?res[id].pts:inXI(id,g)?PROJ[id]:0;return`<div class="mc"><span>${esc(last(p.name))}<small>${p.team}${showPts?(res[id].played?"":" · DNP"):(inXI(id,g)?"":" · out")}</small></span><b>${v}</b></div>`};
  return`<div class="card scroll"><table class="mt"><thead><tr><th>${esc(teamName(a))}</th><th class="sl"></th><th class="n">${esc(teamName(b))}</th></tr></thead><tbody>${SLOTS.map((sl,i)=>`<tr><td>${cell(la[i])}</td><td class="sl">${sl}</td><td class="rt">${cell(lb[i])}</td></tr>`).join("")}</tbody></table></div>`}
function renderMatchup(){if(S.phase==="predraft"||S.phase==="draft"){shell(hero({title:"Matchup",badge:"—",name:"No matchups yet",subL:"Draft first",subR:""}),'<div class="banner">Matchups start after the draft.</div><button class="btn primary block" data-go="lineup">Go to the draft</button>');return}
  const g=S.week,lastG=g-1,m=g<WEEKS?userMatch(g):null,lm=lastG>=0?userMatch(lastG):null;let b="",badge="—",name="",subL="",subR="";
  if(lm){const o=lm[0]===USER?lm[1]:lm[0];const a=weekScore(lastG,USER),c=weekScore(lastG,o);badge=a;name=`${a} – ${c}`;
    const semi=lastG===7||lastG===8;const verdict=semi?`Semi-final leg ${lastG-6} of 2. Running total ${semiTotal(USER)} – ${semiTotal(o)}.`:a>c?`You beat ${esc(teamName(o))}.`:a<c?`You lost to ${esc(teamName(o))}.`:"A tie.";
    subL=weekLabel(lastG);subR=`<span>vs</span> ${esc(teamName(o))}`;
    b+=`<div class="banner ${semi?"":a>=c?"ok":"err"}">${verdict}</div><div><p class="lbl">${weekLabel(lastG)} result</p>${slotTable(lastG,USER,o,true)}</div>`}
  else if(lastG>=0){badge="—";name="Eliminated";subL=weekLabel(lastG);subR=""}
  if(m){const o=m[0]===USER?m[1]:m[0];if(!lm){badge=lineupProj(S.lineups[USER],g);name=`vs ${teamName(o)}`;subL=weekLabel(g);subR=`<span>proj</span> ${lineupProj(bestLineup(S.rosters[o],g),g)}`}
    b=`<div><div class="lbl-row"><p class="lbl">${weekLabel(g)} preview</p><button class="link" data-go="lineup">Edit lineup</button></div>${slotTable(g,USER,o,false)}<p class="note" style="margin-top:8px">Projected: you ${lineupProj(S.lineups[USER],g)}, ${esc(teamName(o))} ${lineupProj(bestLineup(S.rosters[o],g),g)}. Players not named in the XI project 0.</p></div>`+b}
  else if(g<WEEKS)b=`<div class="banner">You're not in a playoff matchup this week. Play on to see who wins the league.</div>`+b;
  if(S.phase==="done")b=`<div class="banner ok"><b>${esc(teamName(S.champion))}</b> won the LC Mini-League.</div>`+b;
  if(!name)name="Matchup";
  shell(hero({title:"Matchup",badge,name,subL,subR}),b,playFab())}

/* ---------- Players (free agents) ---------- */
function renderPlayers(){const g=S.week,ros=S.rosters[USER],pre=S.phase==="predraft"||S.phase==="draft";
  const fa=freeAgents();let list=(ui.pview==="fa"?fa:PLAYERS).filter(p=>(ui.role==="ALL"||p.role===ui.role)&&p.name.toLowerCase().includes(ui.q.toLowerCase())).sort((a,b)=>PROJ[b.id]-PROJ[a.id]);
  const h=hero({title:"Players",badge:fa.length,name:"Free agents",subL:`${fa.length} <span>available</span>`,subR:pre?"<span>After the draft</span>":`${ros.length} <span>on your roster</span>`});
  let b="";
  if(ui.adding!=null){const p=BY_ID[ui.adding];b+=`<div class="card" style="padding:14px 16px;border-color:var(--gold)"><p class="lbl" style="margin:0 0 6px">Add ${esc(p.name)} (${p.role}). Drop who?</p><div>${ros.map(id=>{const why=swapBlock(ros,p.id,id);return pRow(BY_ID[id],why?`<div class="why">${why}</div>`:`<div class="acts"><button class="ic wide rmw" data-drop="${id}">Drop</button></div>`,status(id))}).join("")}</div><button class="btn" id="cancelAdd" style="margin-top:8px">Cancel</button></div>`}
  b+=`<div class="toggle"><button data-pv="fa" aria-pressed="${ui.pview==="fa"}">Free agents</button><button data-pv="all" aria-pressed="${ui.pview==="all"}">All players</button></div>
   <div class="seg" style="grid-template-columns:repeat(5,1fr)">${["ALL",...ROLES].map(r=>`<button data-role="${r}" aria-pressed="${ui.role===r}">${r==="ALL"?"All":r}</button>`).join("")}</div>
   <div class="search"><input type="search" id="q" placeholder="Search players" value="${esc(ui.q)}" aria-label="Search players"></div>
   <p class="note">Free agents can be added straight away by dropping a player. This prototype skips ESPN's waiver period.</p>
   <div class="card">${list.map(p=>{const o=ownerOf(p.id);const right=o==null?(pre?'<div class="why">After draft</div>':`<div class="acts"><button class="ic add" data-add="${p.id}" aria-label="Add ${esc(p.name)}">+</button></div>`):`<div class="why">${o===USER?"Yours":esc(teamName(o))}</div>`;return pRow(p,right,status(p.id))}).join("")||'<p class="note" style="padding:12px 0">No players match.</p>'}</div>`;
  shell(h,b,null);
  app.querySelectorAll("[data-pv]").forEach(x=>x.onclick=()=>{ui.pview=x.dataset.pv;render()});
  app.querySelectorAll("[data-role]").forEach(x=>x.onclick=()=>{ui.role=x.dataset.role;render()});
  app.querySelectorAll("[data-add]").forEach(x=>x.onclick=()=>{ui.adding=+x.dataset.add;render();window.scrollTo(0,0)});
  const c=$("#cancelAdd");if(c)c.onclick=()=>{ui.adding=null;render()};
  app.querySelectorAll("[data-drop]").forEach(x=>x.onclick=()=>{const drop=+x.dataset.drop,add=ui.adding;S.rosters[USER]=ros.filter(i=>i!==drop).concat(add);const lu=S.lineups[USER];const i=lu.indexOf(drop);if(i>-1)lu[i]=eligible(SLOTS[i],add)?add:null;ui.adding=null;commit()});
  const q=$("#q");q.oninput=e=>{ui.q=e.target.value;const pos=e.target.selectionStart;render();const nq=$("#q");nq.focus();nq.setSelectionRange(pos,pos)}}

/* ---------- League ---------- */
function renderLeague(){const st=standings(),myRank=st.findIndex(x=>x.t===USER)+1;
  const h=hero({title:"League",badge:S.week?"#"+myRank:"—",name:"LC Mini-League",subL:"8 <span>teams</span>",subR:`${Math.min(S.week,REG_WEEKS)}/${REG_WEEKS} <span>regular weeks</span>`});
  let b=`<div><p class="lbl">Standings</p><div class="card scroll"><table><thead><tr><th class="n">#</th><th>Team</th><th class="n">W-L</th><th class="n">PF</th><th class="n">PA</th></tr></thead><tbody>
   ${st.map((r,i)=>`<tr class="${r.t===USER?"me":""}${i===3?" cut":""}"><td class="n">${i+1}</td><td><b style="font-weight:500">${esc(teamName(r.t))}</b><div class="note" style="font-size:12.5px">${esc(managerName(r.t))}</div></td><td class="n">${recStr(r)}</td><td class="n">${r.pf}</td><td class="n">${r.pa}</td></tr>`).join("")}</tbody></table></div>
   <p class="note" style="margin-top:8px">Top 4 after week 7 make the playoffs. Ties in the table are split by points for.</p></div>`;
  if(S.seeds){const s=S.seeds;b+=`<div><p class="lbl">Playoffs</p><div class="card" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <div><small class="note">Semi-finals · weeks 8–9 combined</small>${[[s[0],s[3]],[s[1],s[2]]].map(([a,c])=>`<div class="br"><span>${esc(teamName(a))}</span><b>${S.week>7?semiTotal(a):"–"}</b></div><div class="br"><span>${esc(teamName(c))}</span><b>${S.week>7?semiTotal(c):"–"}</b></div>`).join('<hr>')}</div>
    ${S.final?`<div><small class="note">Final · week 10</small><div class="br"><span>${esc(teamName(S.final[0]))}</span><b>${weekScore(9,S.final[0])??"–"}</b></div><div class="br"><span>${esc(teamName(S.final[1]))}</span><b>${weekScore(9,S.final[1])??"–"}</b></div></div>`:""}
    ${S.champion!=null?`<div class="banner ok">Champion: <b>${esc(teamName(S.champion))}</b></div>`:""}</div></div>`}
  b+=`<div><p class="lbl">Schedule</p><div class="card">${SCHEDULE.map((wk,w)=>`<div class="sch"><small class="note">Week ${w+1}${w===S.week?" · next":""}</small>${wk.filter(p=>p.includes(USER)).map(([a,c])=>{const o=a===USER?c:a;const sa=weekScore(w,USER),so=weekScore(w,o);return`<div class="br"><span>vs ${esc(teamName(o))}</span><b class="${sa==null?"":sa>so?"win":sa<so?"loss":""}">${sa==null?"–":`${sa>so?"W":sa<so?"L":"T"} ${sa}–${so}`}</b></div>`}).join("")}</div>`).join("")}</div></div>
  <div><p class="lbl">Team name</p><div class="search"><input type="text" id="tn" value="${esc(S.teamName)}" maxlength="32" aria-label="Team name"><button class="btn" id="savetn">Rename</button></div></div>
  <div><p class="lbl">Account</p><div class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:12px"><div>${esc(ui.user?.name||"")}<div class="note">${esc(ui.user?.email||"")}</div></div>
   <div class="actions"><button class="btn" id="signout">Sign out</button><button class="btn" id="reset">${ui.resetArm?"Tap again to confirm":"New season"}</button></div></div></div>`;
  shell(h,b,null);
  $("#savetn").onclick=()=>{S.teamName=$("#tn").value.trim()||"LC Strikers";commit()};
  $("#signout").onclick=()=>{ui.user=null;ui.screen="auth";ui.authMode="in";render();window.scrollTo(0,0)};
  $("#reset").onclick=()=>{if(ui.resetArm){ui.resetArm=false;const tn=S.teamName;S=fresh();S.teamName=tn;for(const k in gwCache)delete gwCache[k];S.tab="home";commit();window.scrollTo(0,0)}else{ui.resetArm=true;render();setTimeout(()=>{if(ui.resetArm){ui.resetArm=false;if(S.tab==="league"&&ui.screen==="app")render()}},4000)}}}

/* ---------- Rules ---------- */
function renderRules(){const t=(title,rows)=>`<div><p class="lbl">${title}</p><div class="card"><table class="rules"><tbody>${rows.map(([a,c])=>`<tr><td>${a}</td><td class="n">${c}</td></tr>`).join("")}</tbody></table></div></div>`;
  shell(hero({title:"Rules",badge:"T20",name:"How it works",subL:"ESPN-style <span>league</span>",subR:"<span>SA20</span>"}),
  `<p>Season-long, head-to-head league modelled on ESPN fantasy football. Draft a roster, set a lineup each week, and play one rival per week. The best record after week 7 wins a playoff spot.</p>
  ${t("League",[["Teams","8 (you + 7 rivals)"],["Draft","Snake, 12 rounds"],["Player ownership","Each player on one team only"],["Starting lineup","WK, 2 BAT, 2 AR, 3 BWL, FLEX"],["Bench","3"],["Roster limits","WK ≤2, BAT ≤4, AR ≤4, BWL ≤5"],["Free agents","Add any time by dropping a player"]])}
  ${t("Season",[["Fantasy week","One SA20 round (each franchise plays once)"],["Regular season","Weeks 1–7, play every rival once"],["Standings","Wins, then points for"],["Playoffs","Top 4: semis over weeks 8–9, final week 10"],["Player not in playing XI","Scores 0; no auto-subs"]])}
  ${t("Batting",[["Run","+1"],["Boundary bonus","+1"],["Six bonus","+2"],["30-run bonus","+4"],["Half-century","+8"],["Century (replaces lower bonuses)","+16"],["Duck (not bowlers)","−2"],["Strike rate, min 10 balls: >170 / 150–170 / 130–150","+6 / +4 / +2"],["Strike rate: 60–70 / 50–59.99 / <50","−2 / −4 / −6"]])}
  ${t("Bowling",[["Wicket (not run out)","+25"],["LBW or bowled bonus","+8"],["3 / 4 / 5-wicket haul","+4 / +8 / +16"],["Maiden","+12"],["Economy, min 2 overs: <5 / 5–5.99 / 6–7","+6 / +4 / +2"],["Economy: 10–11 / 11.01–12 / >12","−2 / −4 / −6"]])}
  ${t("Fielding and other",[["Catch","+8"],["3-catch bonus","+4"],["Stumping","+12"],["Run out, direct / assist","+12 / +6"],["Named in playing XI","+4"]])}
  <p class="note">Squads: SA20 2027 squads after the 7 October 2026 auction, as reported by Wisden. Player roles, projections, fixture order and all match results are prototype values generated by the app. Scoring follows the published Dream11 T20 point system.</p>`,null)}

/* ---------- Boot ---------- */
function render(){if(ui.screen==="auth")return renderAuth();if(!S.tab)S.tab="home";({home:renderHome,lineup:renderLineup,matchup:renderMatchup,players:renderPlayers,league:renderLeague,rules:renderRules}[S.tab]||renderHome)()}
function commit(){save();render()}
render();
(function splash(){const sp=document.getElementById("splash");const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done=()=>{sp.classList.add("out");setTimeout(()=>sp.hidden=true,400)};sp.onclick=done;setTimeout(done,reduce?600:2300)})();
</script>

</body>
</html>
